<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 · DannyComputer2008</title>
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#F5F5F7">
    <!-- 首屏前预设主题：优先用户手动选择，其次跟随系统深色模式 -->
    <script>
        (function () {
            try {
                var theme = null;
                try { theme = localStorage.getItem('dc2008-theme'); } catch (e) {}
                var dark = theme ? theme === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        :focus-visible { outline: 2px solid #0071E3 !important; outline-offset: 3px !important; }
        .dark :focus-visible { outline-color: #2997FF !important; }
    </style>
</head>
<body class="font-sans bg-white text-[#1D1D1F] dark:bg-black dark:text-[#F5F5F7] selection:bg-appleBlue selection:text-white">
    <main class="min-h-screen flex flex-col items-center justify-center px-6 py-16 text-center">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-appleBlue mb-4">Error 404</p>
        <h1 class="text-7xl sm:text-8xl font-extrabold tracking-tight text-appleBlue mb-5">404</h1>
        <h2 data-i18n="title" class="text-2xl sm:text-3xl font-bold tracking-tight mb-3">页面未找到</h2>
        <p data-i18n="desc" class="max-w-md text-sm sm:text-base leading-relaxed text-[#6E6E73] dark:text-[#86868B] mb-9">您访问的页面不存在，或已被移动。请返回首页，或直接预约上门服务。</p>
        <div class="flex flex-col sm:flex-row items-center gap-3">
            <a href="/" data-i18n="home" class="inline-flex items-center justify-center min-w-[168px] px-8 py-3.5 rounded-full bg-appleBlue hover:bg-appleBlueHover text-white text-sm font-semibold transition-colors">返回首页</a>
            <a href="/#booking" data-i18n="book" class="inline-flex items-center justify-center min-w-[168px] px-8 py-3.5 rounded-full border border-black/10 dark:border-white/15 bg-white/80 dark:bg-[#161617]/80 text-sm font-semibold transition-colors">预约上门服务</a>
        </div>
        <p class="mt-16 text-xs text-[#6E6E73] dark:text-[#86868B]">© DannyComputer2008</p>
    </main>

    <script>
        // 中英双语：与主站一致，优先使用用户手动选择的语言，其次跟随浏览器语言
        (function () {
            var dict = {
                zh: { pageTitle: '页面未找到 · DannyComputer2008', title: '页面未找到', desc: '您访问的页面不存在，或已被移动。请返回首页，或直接预约上门服务。', home: '返回首页', book: '预约上门服务' },
                en: { pageTitle: 'Page Not Found · DannyComputer2008', title: 'Page Not Found', desc: 'The page you’re looking for doesn’t exist or has been moved. Head back home, or book an on-site service directly.', home: 'Back to Home', book: 'Book Service' }
            };
            var saved = null;
            try { saved = localStorage.getItem('dc2008-language'); } catch (e) {}
            var lang = saved || (((navigator.language || 'zh').toLowerCase().indexOf('zh') === 0) ? 'zh' : 'en');
            if (!dict[lang]) lang = 'zh';
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.title = dict[lang].pageTitle;
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
                var v = dict[lang][el.getAttribute('data-i18n')];
                if (v) el.textContent = v;
            });
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta && document.documentElement.classList.contains('dark')) meta.setAttribute('content', '#000000');
        })();
    </script>
</body>
</html>
